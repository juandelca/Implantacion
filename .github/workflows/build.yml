name: Build Civil 3D Plugin

on: [push]

jobs:
  build:
    runs-on: windows-latest

    steps:
    # 1. Descarga tu código
    - name: Checkout repository
      uses: actions/checkout@v4

    # 2. Configura msbuild (el compilador de .NET Framework)
    - name: Setup .NET Framework (msbuild)
      uses: microsoft/setup-msbuild@v1

    # 3. Configura NuGet (para descargar las APIs)
    - name: Setup NuGet
      uses: NuGet/setup-nuget@v1
      with:
        nuget-version: 'latest'

    # 4. Restaura los paquetes (descarga las APIs de Civil 3D)
    - name: Restore NuGet packages
      # Le decimos que busque el .csproj en la RAÍZ
      run: nuget restore ${{ github.workspace }}\Civil3D_Phase1.csproj

    # 5. Compila el proyecto
    - name: Build project
      # Le decimos que compile el .csproj en la RAÍZ
      run: msbuild ${{ github.workspace }}\Civil3D_Phase1.csproj /p:Configuration=Release

    # 6. Sube la DLL
    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Civil3D-Phase1-DLL
        # La DLL ahora estará en la RAÍZ
        path: ${{ github.workspace }}\bin\x64\Release\Civil3D_Phase1.dll
