name: Build Civil 3D Plugin

on: [push]

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup .NET Framework (msbuild)
      uses: microsoft/setup-msbuild@v1
      
    - name: Setup NuGet
      uses: NuGet/setup-nuget@v2

    # --- RUTA CORREGIDA ---
    - name: Restore NuGet packages
      run: nuget restore ${{ github.workspace }}\Implantacion\Civil3D_Phase1.csproj

    # --- RUTA CORREGIDA ---
    - name: Build project
      run: msbuild ${{ github.workspace }}\Implantacion\Civil3D_Phase1.csproj /p:Configuration=Release /p:Platform=AnyCPU

    # --- RUTA CORREGIDA ---
    - name: Zip Release folder
      run: |
        Compress-Archive -Path ${{ github.workspace }}\Implantacion\bin\Release\* -DestinationPath ${{ github.workspace }}\Release.zip
      shell: powershell

    - name: Upload Full Release Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Civil3D-Phase1-FullRelease
        path: ${{ github.workspace }}\Release.zip
